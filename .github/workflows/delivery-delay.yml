name: Delivery delay mini-project
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore PartnerAPI.sln
      - run: dotnet build PartnerAPI.sln --no-restore --configuration Release
      - run: dotnet test PartnerAPI.sln --no-build --configuration Release
      - run: dotnet run --project tools/Shipping.DelayPrediction.Trainer --configuration Release --no-build -- data/delivery-delay.sample.csv artifacts/delivery-delay.zip delay-ci-v1
      - uses: actions/upload-artifact@v4
        with:
          name: delivery-delay-evaluation
          path: artifacts/*.json
